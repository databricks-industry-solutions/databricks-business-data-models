# ─────────────────────────────────────────────────────────────────────────────
# CANONICAL validation-job DAB template — domain-model-validation, Phase 4.
#
# HOW TO USE: copy to resources/{domain}_validation.job.yml and fill every
# {placeholder}. Author it ONCE, then deploy per the environment-detect→route→
# handoff contract (etl-development-framework/deployment-and-dab.md "Deploy is environment-routed").
# On serverless Genie Code the agent does NOT deploy — it authors this file and
# hands off to the Deployments panel (🚀). NEVER stand the job up task-by-task via
# the Jobs API / editAsset / SDK, and NEVER concatenate a second `resources:` doc
# into this file (the Meridian run shipped two `resources:` roots + two job ids —
# the Phase 4 job-YAML gate exists to catch exactly that).
#
# INVARIANTS (the Phase 4 gate checks these):
#   • EXACTLY ONE top-level `resources:` block in this file.
#   • ONE job identity (one key under `jobs:`); no `id:` pinned by hand — the
#     bundle owns job identity and reconciles it on every deploy.
#   • `source: WORKSPACE` + ABSOLUTE notebook paths — validation notebooks are
#     workspace objects created via createAsset, NOT bundle-managed local files
#     (Rule 17). Without `source: WORKSPACE` the deploy looks for local files and
#     fails. (This differs from the ETL daily job, whose runners ARE bundle files
#     referenced by relative `../src/...` paths.)
#   • Tasks in load-order tiers (dims → facts); `scorecard` is the terminal task
#     depending on ALL narrative tasks (it claims every PENDING row exactly once).
#   • max_concurrent_runs: 1 — prevents two scorecard runs racing to claim PENDING.
#   • IF you run this job on SERVERLESS (omit job_clusters — the preferred path),
#     you MUST add a job-level `environments:` block, or `jobs/create` 400s with
#     "Job environment 'default' used by task ... is not defined in field
#     'environments'". See etl-development-framework/deployment-and-dab.md
#     "Serverless jobs REQUIRE a job-level environments block". The block:
#         environments:
#           - environment_key: default
#             spec:
#               client: "1"
#     Drop job_clusters + the per-task `job_cluster_key` lines when going serverless.
#     The classic-cluster template below does NOT need `environments:`.
#
# Values resolve from conventions.yml: schedule=deployment.default_schedule_cron,
# timezone=deployment.default_timezone, email=deployment.alert_email. Catalog/
# schema are RUNTIME PARAMETERS (below), never baked into the notebooks.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  jobs:
    {domain}_validation:
      name: {domain}_validation
      description: |
        Runs all {N} per-entity narrative/regression notebooks for the {domain} silver domain
        in load-order tiers, then the scorecard claims PENDING check results and computes
        entity grades. Overall grade B+ or above passes the quality gate; any entity Grade
        D/F fails the scorecard task (and the job).

      # Schedule PAUSED until the silver ETL job has a first green run. Unpause after.
      schedule:
        quartz_cron_expression: "{validation_cron}"   # e.g. "0 0 7 * * ?" — 1h after silver load
        timezone_id: "{job_timezone}"                  # conventions.yml deployment.default_timezone
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - "{alert_email}"                            # conventions.yml deployment.alert_email

      # Terminal scorecard must not race a second run to claim the same PENDING rows.
      max_concurrent_runs: 1

      # Job-level params fan into every task's base_parameters. Catalog/schema are the
      # SAME DAB variables the ETL job uses; triggered_by lets the scorecard record provenance.
      parameters:
        - name: silver_catalog
          default: {silver_catalog}                    # conventions.yml catalogs.silver
        - name: silver_schema
          default: {silver_schema}                     # resolves to {domain} model schema
        - name: triggered_by
          default: SCHEDULED

      # Single shared single-node cluster is plenty for metadata-only validation queries.
      # (Omit job_clusters entirely to use serverless instead — preferred where available.)
      job_clusters:
        - job_cluster_key: validation_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: {node_type_id}               # e.g. m5d.large (AWS) / Standard_DS3_v2 (Azure)
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*,4]"
            custom_tags:
              ResourceClass: SingleNode

      tasks:
        # ── Tier 0: dimensions with no FK dependencies (run in parallel) ──────────
        # REPEAT this task block for each Tier-0 dim. notebook_path is ABSOLUTE and
        # points at the workspace object created by createAsset (no extension).
        - task_key: narrative_{tier0_dim_a}
          job_cluster_key: validation_cluster
          notebook_task:
            notebook_path: /Workspace/Users/{deployer}/{domain}/src/silver/validation/narrative_{tier0_dim_a}
            source: WORKSPACE
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema:  "{{job.parameters.silver_schema}}"

        - task_key: narrative_{tier0_dim_b}
          job_cluster_key: validation_cluster
          notebook_task:
            notebook_path: /Workspace/Users/{deployer}/{domain}/src/silver/validation/narrative_{tier0_dim_b}
            source: WORKSPACE
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema:  "{{job.parameters.silver_schema}}"

        # ── Tier 1+: later dims / facts — add depends_on for the tier(s) below ────
        # A fact depends on the dims it references so FK checks run against fresh data.
        - task_key: narrative_{tier1_entity}
          depends_on:
            - task_key: narrative_{tier0_dim_a}
            - task_key: narrative_{tier0_dim_b}
          job_cluster_key: validation_cluster
          notebook_task:
            notebook_path: /Workspace/Users/{deployer}/{domain}/src/silver/validation/narrative_{tier1_entity}
            source: WORKSPACE
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema:  "{{job.parameters.silver_schema}}"

        # … add one task block per remaining entity, in tier order, each depending on
        #    the entities whose dims/facts it validates against. Keep task_key ==
        #    narrative_{entity} so the DAG reads 1:1 against the entity list.

        # ── Scorecard: TERMINAL task — depends on the LAST tier's tasks ───────────
        # The scorecard claims ALL PENDING rows, so it must run after every narrative
        # task. Depend on the final-tier tasks (transitively covers earlier tiers).
        - task_key: scorecard
          depends_on:
            - task_key: narrative_{final_tier_entity_a}
            - task_key: narrative_{final_tier_entity_b}
          job_cluster_key: validation_cluster
          notebook_task:
            notebook_path: /Workspace/Users/{deployer}/{domain}/src/silver/validation/scorecard
            source: WORKSPACE
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema:  "{{job.parameters.silver_schema}}"
              triggered_by:   "{{job.parameters.triggered_by}}"
