# =============================================================================
# conventions.yml — the SINGLE config surface for a customer/domain
# =============================================================================
# This is the one file a new customer edits to "add their own flavor." All four
# loop skills + domain-sync read it. Copy it to the project root, fill it in, and
# the skills resolve naming, catalogs, source-system tags, and load-strategy
# thresholds from here instead of from hard-coded literals.
#
# The values below are the MERIDIAN EXAMPLE PROFILE — Meridian Fluid Controls, a
# fictional industrial-valve manufacturer whose synthetic bronze dataset ships in
# this repo under `examples/` (the portable, non-customer demo). Replace them for
# a real customer. `naming-standards.md` is the detailed rationale for each rule;
# this file is the machine-readable knob. The naming/coding conventions below are
# generic best practice — keep them; only the identifiers (customer, catalogs,
# bronze schemas, source-system enum) are example values to swap out.
#
# RULE FOR GENERATORS: catalogs/schemas are RUNTIME PARAMETERS, not literals and
# not authoring-time substitutions. Generated notebooks declare widgets and read
# catalog/schema from them; the DAB job passes the values in per target (dev/prod)
# via `base_parameters` wired to DAB `variables`. This file supplies the DEFAULTS
# and the per-source bronze map — NEVER bake catalog/schema/host/email literals
# into generated SQL. The same notebook object must promote dev→prod unchanged.
# See etl-development-framework/deployment-and-dab.md "Runtime Parameters".
# =============================================================================

customer: meridian        # short slug, used in project/skill context
domain: sales_order       # the domain this project covers

# --- Output model (THE shape knob) -------------------------------------------
# Selects the shape of the built schema. The vibe model is a normalized, 3NF,
# single-source-of-truth SPEC (read-only) — this knob decides what we build FROM
# it. The build is always "a buildable per-domain schema SEEDED BY the vibe model
# and reconciled against bronze" — drift from the model is expected and fine.
#
#   normalized  -> (DEFAULT) Faithful-ish port: one table per vibe-model product, 3NF,
#                  the model's PK/FK preserved (SSOT). Product names (customer, order),
#                  the model's lowercase PKs (order_id). No dim_/fact_ prefixes.
#                  Inherits the agent's structure; does NOT re-run/re-litigate the
#                  agent's ~250 modeling rules, and applies NO Kimball rules.
#   dimensional -> Kimball star: dim_/fact_/bridge_, surrogate keys,
#                  conformed dims, explicit grain. The normalized model is the
#                  SEED, then dimensionalize. This is the current Acuity behavior.
#   hybrid      -> LAYERED, not "both shapes at once": a normalized 3NF SSOT SILVER
#                  layer, THEN a dimensional Kimball star built DOWNSTREAM from that
#                  silver in the GOLD layer. Silver first; gold reads silver. Model
#                  keys in silver; the star (surrogates + any SCD2) lives in GOLD.
#
# INVARIANT: every mode CREATEs fresh tables in catalogs.silver and NEVER writes
# to the vibe model. The model is a logical spec; when the agent emits a new
# version, rebuild fresh — there is no in-place MERGE into model tables and no
# model-version migration logic.
# See etl-development-framework/SKILL.md "Layering Contract" + ddl-and-modeling.md.
output_model: normalized   # normalized | dimensional | hybrid   (default: normalized)

# --- ETL type (THE build-mechanism knob) -------------------------------------
# Selects the build MECHANISM. Orthogonal to output_model (which selects the
# model SHAPE) — SDP mode still honors normalized/dimensional/hybrid.
#   merge_notebook -> one load notebook per entity + a daily job.
#                     DDL is a separate setup step.
#   sdp_pipeline   -> (DEFAULT) whole-domain Lakeflow Declarative Pipeline: ONE plain-.sql
#                     declarative source per entity (inline schema + CONSTRAINT EXPECT
#                     + AS query / FLOW AUTO CDC), hardcoded bronze paths (NO native
#                     `parameters:` — the beta breaks on STREAM IDENTIFIER(:param)),
#                     and NO build-time testing (LDP unit tests are beta + Editor-only;
#                     confidence is inline EXPECT + the downstream domain-model-validation
#                     skill), deployed as ONE `pipeline` DAB resource (FILE/glob model,
#                     root_path). DDL lives INSIDE the flow — there is NO separate
#                     DDL-setup step in this mode.
# INTERACTIONS (all still apply in sdp_pipeline mode):
#   output_model  -> dimensional SDP still emits dim_/fact_ + SHA2 surrogates.
#   scd_strategy  -> type_2 maps to `AUTO CDC ... STORED AS SCD TYPE 2` (not the
#                    two-statement versioning MERGE).
#   etl_language  -> drives the SOURCE dialect (SQL vs Python) of the declarative
#                    pipeline sources.
#   load_strategy -> classification still runs, but chooses streaming-table vs
#                    materialized-view + flow type (see sdp-pipeline-development.md),
#                    not a MERGE variant.
# See etl-development-framework/sdp-pipeline-development.md for the template pack.
etl_type: sdp_pipeline   # merge_notebook | sdp_pipeline   (default: sdp_pipeline)

# --- Vibe model location (READ-ONLY — where the graded vibe model lives) -----
# THE fix for the "new tables landed in the vibe model's schema" problem. This is
# the empty target/business model the vibe-modeling agent generated: the
# `vibe_metamodel_*` tables + the empty template DDL. Two skills READ it and NEVER
# write to it:
#   - domain-model-assessment: Phase 1 metamodel inspection + information_schema
#     reads (discovery-protocol.md 1.1–1.6) resolve `{catalog}.{schema}` FROM HERE.
#   - etl-development-framework: the "target model" it maps sources against in gap
#     analysis (discovery-and-gap-analysis.md) reads the structure FROM HERE.
# This is a DISCOVERY/AUTHORING-TIME location, not an ETL runtime widget — the
# build reads it while generating DDL/specs, then LANDS built tables into the
# SEPARATE silver location below. Keep these strictly distinct so a build never
# writes into the model it is grading against.
vibe_model:
  catalog: meridian_sales_model   # catalog the vibe model + vibe_metamodel_* live in
  schema:  sales_order            # schema the vibe model lives in (READ-ONLY)
  # --- Metamodel layout (OPTIONAL — set only if the metamodel is NOT co-located/prefixed) ---
  # The metamodel tables (business/product/attribute/domain) appear in two layouts in the wild:
  #   1. Co-located + prefixed (DEFAULT): `vibe_metamodel_*` in the SAME schema as the model
  #      tables. Leave both keys unset → skill uses schema=`schema` above, prefix=`vibe_metamodel_`.
  #   2. Separate `_metamodel` schema, UN-prefixed: bare `business`/`product`/`attribute`/`domain`
  #      in a dedicated schema. Set the two keys below so the skill reads the right place.
  # If unset, domain-model-assessment probes information_schema to detect the layout
  # (discovery-protocol.md Step 1.0). Set these to skip the probe / when you know the layout.
  # metamodel_schema: _metamodel       # schema holding the metamodel tables (default: `schema`)
  # metamodel_prefix: ""               # "" for bare names, "vibe_metamodel_" for prefixed (default)
  # version: latest                    # pin a model version; default = MAX version for this domain

# --- Catalog map (DEFAULTS for the params — skills never CREATE catalogs) ----
# These are the DEFAULT values the runtime widgets fall back to and the values a
# DAB target maps into `base_parameters`. They are NOT substituted into SQL at
# authoring time — generated notebooks read them from widgets at run time.
catalogs:
  bronze: meridian_bronze
  silver: meridian_model   # LAND/WRITE target — where the build CREATEs + MERGEs
                                       # built silver. Distinct from `vibe_model` above; may be
                                       # a different catalog entirely. NEVER the vibe_model catalog.
  gold:   manufacturing_gold_vibe     # example gold target (adjust per customer)
  sandbox: manufacturing_sandbox_dev  # dev/workshop target

# --- Schema patterns ---------------------------------------------------------
# `silver_pattern` names the WRITE/LAND schema for built silver (resolves to
# `silver_schema`). It is INTENTIONALLY different from `vibe_model.schema` above —
# the model is read from `vibe_model`, the build lands into `catalogs.silver` +
# this pattern. If a customer really wants the built silver to sit in the same
# catalog as the vibe model, set `catalogs.silver == vibe_model.catalog` but keep
# this schema pattern distinct from `vibe_model.schema` so tables never collide.
schemas:
  silver_pattern: "{domain}_silver"      # WRITE target schema, e.g. sales_order_silver
  gold_pattern:   "{domain}_gold"
  sandbox_pattern: "{domain}_{layer}_{project}"

# --- Notebook language (MERGE + validation notebooks) ------------------------
# Selects the source-language of generated MERGE and validation notebooks.
#   sql    -> native SQL notebooks:  first line `-- Databricks notebook source`,
#             cells split by `-- COMMAND ----------`, markdown as `-- %md`,
#             params as `:name` markers + IDENTIFIER(). (DEFAULT — unchanged behavior.)
#   python -> Python notebooks that HOST the same SQL via spark.sql(f"..."):
#             first line `# Databricks notebook source`, cells `# COMMAND ----------`,
#             widget values read once via dbutils.widgets.get and f-string-interpolated
#             into the SQL body. Same transform SQL, different host wrapper.
# INVARIANT: DDL notebooks are ALWAYS SQL. Model Guide / Genie / dashboard config are
# ALWAYS SQL. Only MERGE and validation notebooks follow this setting; validation
# inherits the SAME value as ETL. See etl-development-framework/deployment-and-dab.md
# "Notebook-format contract".
etl_language: sql          # sql | python  (default: sql)

# --- Bronze source map (logical source name → catalog.schema prefix) ---------
# THE fix for multi-source notebooks. A silver load often reads several bronze
# schemas — sometimes across DIFFERENT catalogs (e.g. ERP vs HR vs gold). Do NOT
# try to force sources through a single source_catalog/source_schema pair. Instead
# give each LOGICAL source its own fully-qualified prefix param; a notebook
# declares a widget for each source it actually reads and references it via
# IDENTIFIER():
#     FROM IDENTIFIER(:src_sap_sd || '.vbak')
#     JOIN IDENTIFIER(:src_salesforce_crm || '.quotation') ...
# Because each prefix carries its own catalog, cross-catalog joins just work (when
# sources span catalogs). Meridian's five sources happen to share ONE catalog,
# which is the common single-catalog case; keep the per-source prefix pattern
# anyway so a mixed-catalog customer needs no structural change.
# The DAB defines these as per-target variables; the job passes the ones a task
# needs into that task's base_parameters. Discovery (Phase 1) records which
# sources each entity reads — the widget list per notebook comes from there.
#
# Naming: widget/param name is `src_{logical}`, value is `{catalog}.{schema}`.
# Replace the entries below with the new customer's real bronze schemas. This map
# is also the single source of truth for domain-model-assessment's schema search
# (discovery-protocol.md Step 2.1) — de-hardcode that table from here.
bronze_sources:
  # Meridian example profile — logical name → catalog.schema:
  src_sap_sd:         meridian_bronze.sap_sd          # SAP S/4HANA SD (ERP of record; raw/cryptic)
  src_salesforce_crm: meridian_bronze.salesforce_crm  # Salesforce CRM (clean)
  src_edi_gateway:    meridian_bronze.edi_gateway     # Homegrown EDI middleware (semi-clean)
  src_returns_portal: meridian_bronze.returns_portal  # Bolt-on RMA web app (own flavor)
  src_fieldlink:      meridian_bronze.fieldlink       # Field-service app (net-new; no silver home yet)

# --- Object naming -----------------------------------------------------------
# NAMING + KEY STRATEGY ARE DRIVEN BY `output_model` ABOVE. The old
# `follow_vibe_model_ddl` boolean is RETIRED — its "mirror the model" intent is now
# `output_model: normalized`, and "apply the Kimball standard" is
# `output_model: dimensional`. The per-mode behavior:
#
#   normalized  -> The vibe model's DDL is authoritative for EVERY table (it defines
#                  them all): product names, lowercase `order_id` PKs, the model's
#                  FK graph. dim_/fact_/bridge_ prefixes are NOT used. Keys FOLLOW
#                  the model (surrogate_key_method: NONE) — add a surrogate only
#                  where the model PK is composite/mutable or cross-source
#                  integration needs one. business_column_case follows the model.
#   dimensional -> The Kimball standard below applies: dim_/fact_/bridge_ prefixes,
#                  {Entity}_Key SHA2 surrogates, Pascal_Snake business columns. The
#                  model's product names/keys SEED the design but are re-shaped.
#   hybrid      -> Normalized silver follows the model (as `normalized`); the gold
#                  star follows the Kimball standard (as `dimensional`).
#
# In ALL modes: metadata/audit column casing (_lower_snake) + the -1 FK default
# apply. See etl-development-framework/naming-standards.md "⚠️ Precedence & key
# strategy by mode".
naming:
  table_case: lower_snake                # dim_customer, fact_sales_order_line  (dimensional)
  dim_prefix: "dim_"                      # dimensional mode (+ hybrid gold) only
  fact_prefix: "fact_"                   # dimensional mode (+ hybrid gold) only
  bridge_prefix: "bridge_"               # dimensional mode (+ hybrid gold) only
  gold_prefix: ""                        # gold tables have NO dim_/fact_ prefix
  entity_form: singular                  # dim_customer, not dim_customers
  business_column_case: Pascal_Snake     # dimensional mode; normalized/hybrid-silver follow the model
  metadata_column_case: _lower_snake     # _source_system, _loaded_at  (ALWAYS applies, all modes)
  surrogate_key_suffix: "_Key"           # {Entity}_Key  (dimensional / hybrid-gold)
  # surrogate_key_method is a PER-MODE default, not a global literal:
  #   dimensional / hybrid-gold -> SHA2   (surrogate keys required; mandatory for SCD2)
  #   normalized  / hybrid-silver -> NONE (follow the model's PKs; surrogate only by exception)
  surrogate_key_method: SHA2             # SHA2 | NONE — resolved per output_model (see comment)
  # surrogate_key_formula — the EXACT hash expression used to derive a surrogate PK
  # from a natural key, AND to resolve a FK to a parent's surrogate. THE single
  # documented source of this formula: both the merge and SDP paths READ it here
  # instead of reverse-engineering it from loaded data. The build selects the
  # variant by the vibe model's DECLARED PK type — etl_type (merge vs SDP) does NOT
  # change the key TYPE; only output_model + the model's declared types do.
  #   bigint -> use when the model declares BIGINT PKs (the Meridian model does).
  #   string -> use when the model declares STRING PKs (full 64-char SHA2 hex).
  # Composite natural keys: wrap in CONCAT_WS('|', COALESCE(CAST(k AS STRING),'~'), …)
  # before hashing, using the SAME '~' null sentinel. See
  # etl-development-framework/naming-standards.md "key strategy by mode".
  surrogate_key_formula:
    bigint: "CAST(CONV(SUBSTRING(SHA2(CONCAT_WS('|', COALESCE(CAST({natural_key} AS STRING), '~')), 256), 1, 15), 16, 10) AS BIGINT)"
    string: "SHA2(COALESCE(CAST({natural_key} AS STRING), '~'), 256)"
  fk_naming: same_as_parent_pk           # FK column == parent dim's PK name (dimensional)

# --- Audit / metadata columns (added to every table) -------------------------
audit_columns:
  prefix: "_"
  columns: [_source_system, _loaded_at, _created_by, _modified_by]
  event_timestamp: _source_updated_at    # carried on incremental/append facts (event-time, NOT _loaded_at)

# --- Source-system enum (values written into _source_system) -----------------
# Replace with the new customer's actual source systems.
source_systems:
  - SAP_S4
  - SALESFORCE
  - EDI
  - RETURNS_PORTAL
  - FIELDLINK

# --- Source-system LABEL per bronze source (logical name -> _source_system value) ---
# The literal written into `_source_system` (and a model `source_system` business column)
# for rows sourced from each logical bronze source. Keyed by the SAME logical names as
# `bronze_sources:` above; every value must be one of `source_systems:`. This removes the
# ad-hoc per-build derivation of `'SAP_S4'`, `'SALESFORCE'`, … literals — read the label from
# here at authoring time instead of guessing it per entity.
source_system_labels:
  src_sap_sd:         SAP_S4
  src_salesforce_crm: SALESFORCE
  src_edi_gateway:    EDI
  src_returns_portal: RETURNS_PORTAL
  src_fieldlink:      FIELDLINK

# --- Physical date/timestamp formats per source (pre-populates Rule C) -------
# Many sources store dates as strings in a fixed, per-source format. SAP columns are
# frequently `yyyyMMdd` 8-digit strings (parse with TRY_TO_DATE(col,'yyyyMMdd')); most
# clean sources are ISO `yyyy-MM-dd`. This is the EXPECTED answer for the Rule C probe,
# not a replacement for it — the build still runs the 30-second probe as a verification
# gate (see merge-and-defensive-coding.md / sdp-pipeline-development.md Rule C), but starts
# from the known convention instead of zero. Keyed by logical bronze source name.
date_formats:
  src_sap_sd:         'yyyyMMdd'      # SAP stores dates as 8-digit strings
  src_salesforce_crm: 'yyyy-MM-dd'
  src_edi_gateway:    'yyyy-MM-dd'
  src_returns_portal: 'yyyy-MM-dd'
  src_fieldlink:      'yyyy-MM-dd'

# --- Load-strategy thresholds (drive the per-entity strategy decision) -------
# See etl-development-framework/merge-and-defensive-coding.md Load Strategy Decision.
load_strategy:
  full_merge_max_rows: 5_000_000         # <= this -> FULL_MERGE
  incremental_max_rows: 100_000_000      # <= this + mutable + has update ts -> INCREMENTAL_MERGE
  # append-only ledgers use APPEND_ONLY regardless of size
  # > incremental_max_rows mutable, or SCD2/streaming-DQ -> escalate to SDP

# --- SCD strategy (dimension history) ----------------------------------------
# Selects whether dimensions keep point-in-time history.
#   type_1 -> (DEFAULT) current-state overwrite (MERGE on surrogate key). No history.
#   type_2 -> versioned history on dim_ tables: _effective_from / _effective_to /
#             _is_current columns, a NEW surrogate per version (natural key stays
#             stable), close-prior-insert-new MERGE. Facts join to the version
#             current at event time.
# MODE INTERACTION (enforced): type_2 is a DIMENSIONAL concept — valid only in
# `output_model: dimensional`, or the GOLD layer of `hybrid`. It is NOT supported on
# normalized-mode silver (3NF does history via temporal/effective-dating). If a
# customer wants SCD2 in `normalized` mode, that is a signal they actually want
# `hybrid` — the skill errors early on normalized + type_2 rather than bolting
# versioning onto 3NF silver. type_2 forces surrogate_key_method: SHA2 regardless
# of the per-mode default (you cannot version without a per-version surrogate), and
# type_2 entities never use plain full-refresh (escalate to the versioning MERGE, or
# to Lakeflow SDP for very large / high-churn dims).
# Per-entity override lives in etl_detailed_spec.md when only some dims need history.
# See etl-development-framework/merge-and-defensive-coding.md + ddl-and-modeling.md.
scd_strategy: type_1        # type_1 | type_2   (default: type_1)

# --- Known-null column disposition -------------------------------------------
# A "known-null" column is a mapped bronze source column that is 100% NULL across
# all rows (rows exist; the column is entirely null). The assessment detects it
# during profiling and marks it Gap? = NULL_SOURCE in the S2T report. This knob
# decides what the BUILD does with such a column. A per-column override lives in
# etl_detailed_spec.md §2 "Null Disposition" (blank there = this global default).
#   keep -> (DEFAULT) build the column. It is a DOCUMENTED all-null column (not a
#           silent null) and is recorded as a NULL_SOURCE gap in _gap_registry.
#   drop -> omit the column from the built DDL. This is the ONLY sanctioned
#           deviation from "DDL business-column count == vibe-model column count"
#           (ddl-and-modeling.md Mandatory Model Introspection), and every dropped
#           column MUST have a NULL_SOURCE _gap_registry row + a per-domain review
#           line. NEVER a silent removal — knob-blind, independent of output_model.
null_columns:
  disposition: keep   # keep | drop   (default: keep)

# ── Model deviation (opt-in) ─────────────────────────────────────────────
# Default OFF: the assessment NEVER silently descopes. A modeled entity/column with no
# bronze source is recorded DEFERRED, not dropped. Turn a toggle on to let the assessment
# DROP unsourced model elements or PROPOSE net-new ones — each still passes the Phase 2C /
# Step 2.7 human gate and is logged in the Gap Registry + next_vibes. Deviation makes
# descoping explicit and recoverable, never silent. Use when the customer has landed all the
# bronze they will get and wants to ship silver now (perfect is the enemy of good).
model_deviation:
  preset: none                    # none | pragmatic  (pragmatic flips the common set on:
                                  #   drop_null_columns + drop_unbuilt_domain_fks +
                                  #   drop_no_process_tables + allow_new_entities. An explicit
                                  #   per-toggle value below overrides the preset.)
  drop_null_columns: false        # drop columns whose only bronze source is 100% NULL
  drop_unbuilt_domain_fks: false  # drop FKs pointing at domains not yet built
  drop_no_process_tables: false   # drop modeled tables with no business process / no source
  allow_new_entities: false       # let assessment PROPOSE net-new tables/columns from bronze
                                  #   (propose→build: recorded in the handoff, the ETL build CREATEs
                                  #   them; no metamodel write here)

# --- Gap-status enum (shared by _gap_registry, dashboard, Genie, NEXT_STEPS) -
# Defined in domain-sync/next-steps-generation.md. Do not use legacy Descoped/Backlog.
# NO-SILENT-DESCOPE RULE: a modeled entity/attribute with no bronze source is NEVER
# dropped from the build — it is recorded as DEFERRED with a future-enhancement
# callout ("needs bronze data X; unblocks when X lands"). "The data isn't here yet"
# is a FINDING, not a decision. The symmetric case (bronze reveals meaning the model
# missed) surfaces as a proposed addition. This behavior is KNOB-BLIND — it does not
# depend on output_model. See etl-development-framework/discovery-and-gap-analysis.md.
# NULL_SOURCE gap type: a mapped source column that is 100% null is a _gap_registry
# Gap_Type = NULL_SOURCE (distinct from the status values above). A dropped null
# column (null_columns.disposition: drop) is registered here, never silently removed.
gap_status_enum: [OPEN, IN_PROGRESS, DEFERRED, ACCEPTED, RESOLVED]

# --- Deployment (resolved via DAB variables, NOT baked into SQL) -------------
deployment:
  workspace_host: ""       # set per target in databricks.yml, not here
  alert_email: ""          # failure-notification email
  default_schedule_cron: "0 0 6 * * ? *"
  default_timezone: UTC
