# =============================================================================
# OVERLAY: etl_type: sdp_pipeline  ×  output_model: normalized   (single layer · THE DEFAULT CELL)
# =============================================================================
# Faithful 3NF port of the vibe model, built as ONE whole-domain Lakeflow Declarative Pipeline.
# This is the DEFAULT for BOTH knobs — a base conventions.yml with no output_model/etl_type changes
# already lands here; this overlay is mostly here for completeness + the SDP-specific blocks below.
# Product-named MATERIALIZED VIEWs (small/recomputable) + STREAMING TABLE + append flow (ST-APPEND)
# for append-only facts. Natural PKs, NO dim_/fact_, NO surrogates. SINGLE LAYER — silver only,
# NO downstream gold star.
#
# SDP-mode invariants (all cells): DDL lives inside the flow (no separate DDL step); bronze paths
# are HARDCODED fully-qualified literals (no `parameters:` beta, no IDENTIFIER(:param)); NO
# build-time test/validation artifact (validation is the downstream domain-model-validation skill);
# sources are plain .sql FILE-model libraries (NO notebook-source header). Deploy = ONE `pipeline`
# DAB resource (continuous: false, serverless: true). See sdp-pipeline-development.md.
#
# Set the blocks below on top of a filled-in templates/conventions.yml. NOTE: SDP mode has NO
# test_scratch_* keys (no build-time testing) — omit them, or delete any you added to the base.
# =============================================================================

etl_type: sdp_pipeline         # one whole-domain Lakeflow Declarative Pipeline
output_model: normalized       # 3NF SSOT; MVs + ST-APPEND that follow the vibe model

# SINGLE-LAYER silver. root_path: ../src/silver/pipeline (NOT ../src); ONE glob
# ../src/silver/pipeline/** ; no gold glob. (Set in the DAB pipeline resource, per
# sdp-pipeline-development.md "Layer -> folder -> schema".)
schemas:
  silver_pattern: "{domain}_silver_sdp_norm"  # distinct suffix so it can coexist with other flows
  gold_pattern:   "{domain}_gold"        # unused in normalized mode
  sandbox_pattern: "{domain}_{layer}_{project}"

# NORMALIZED: follow the vibe model's DDL for every table (same as merge.normalized).
naming:
  table_case: lower_snake
  dim_prefix: ""                          # NO dim_ prefix
  fact_prefix: ""                        # NO fact_ prefix
  bridge_prefix: ""
  gold_prefix: ""
  entity_form: singular
  business_column_case: follow_model
  metadata_column_case: _lower_snake     # ALWAYS, all modes
  surrogate_key_suffix: ""
  surrogate_key_method: NONE             # follow the model's PKs
  # see templates/conventions.yml for formula documentation
  surrogate_key_formula:
    bigint: "CAST(CONV(SUBSTRING(SHA2(CONCAT_WS('|', COALESCE(CAST({natural_key} AS STRING), '~')), 256), 1, 15), 16, 10) AS BIGINT)"
    string: "SHA2(COALESCE(CAST({natural_key} AS STRING), '~'), 256)"
  fk_naming: same_as_parent_pk

# type_2 is INVALID in normalized mode. type_1 keeps products as MVs / SCD-type-1 flows (no AUTO CDC).
scd_strategy: type_1
