# =============================================================================
# OVERLAY: etl_type: sdp_pipeline  ×  output_model: hybrid   (two layers, one pipeline)
# =============================================================================
# TWO layers in ONE Lakeflow Declarative Pipeline, built in sequence:
#   - SILVER (3NF SSOT, reads bronze): product-named MVs + ST-APPEND fact, natural PKs, NO
#     dim_/fact_, NO surrogates. (hybrid-silver == normalized.)
#   - GOLD (dimensional Kimball star, reads SILVER not bronze): dim_/fact_ MVs adding SHA2 *_Key
#     surrogates + -1 Unknown members; fact resolves each FK by LEFT JOIN to the gold dim +
#     COALESCE(...Key, -1). Gold objects are schema-qualified to the gold schema.
# The silver->gold DAG resolves in ONE update (gold reads silver by fully-qualified
# catalog.schema.object, NOT bare LIVE.*). 🔴 Gold reads silver, never bronze.
#
# SDP-mode invariants (all cells): DDL inside the flow; HARDCODED bronze paths (no `parameters:`,
# no IDENTIFIER(:param)); NO build-time test/validation artifact; plain .sql FILE-model sources (no
# notebook-source header). Deploy = ONE `pipeline` DAB resource carrying BOTH layers:
# root_path: ../src with TWO globs — ../src/silver/pipeline/** and ../src/gold/pipeline/**.
# See sdp-pipeline-development.md "Hybrid mode" (authoritative recipe) + the DAG-ordering EXIT GATE.
#
# Set the blocks below on top of a filled-in templates/conventions.yml. NOTE: SDP mode has NO
# test_scratch_* keys — omit them, or delete any you added to the base.
# =============================================================================

etl_type: sdp_pipeline         # ONE Lakeflow Declarative Pipeline carrying BOTH layers
output_model: hybrid           # LAYERED: normalized silver THEN dimensional gold (one DAG)

# TWO layers -> TWO schemas, TWO globs (silver + gold), root_path ../src.
schemas:
  silver_pattern: "{domain}_silver_sdp"  # 3NF SSOT (normalized); pipeline default schema
  gold_pattern:   "{domain}_gold_sdp"    # dimensional star (built downstream from silver)
  sandbox_pattern: "{domain}_{layer}_{project}"

# 🔴 LAYER-RESOLVED — do NOT read these keys as global literals. This block is the DIMENSIONAL/
# hybrid-GOLD default; the SILVER layer follows `normalized` regardless. See naming-standards.md
# "⚠️ Precedence & key strategy by mode".
naming:
  table_case: lower_snake                # gold: dim_customer, fact_service_order
  dim_prefix: "dim_"                      # hybrid GOLD only (silver follows the model)
  fact_prefix: "fact_"                   # hybrid GOLD only
  bridge_prefix: "bridge_"               # hybrid GOLD only
  gold_prefix: ""
  entity_form: singular
  business_column_case: Pascal_Snake     # gold: Pascal_Snake; silver follows the model
  metadata_column_case: _lower_snake     # ALWAYS, all modes
  surrogate_key_suffix: "_Key"           # gold: {Entity}_Key (silver keeps natural PKs)
  surrogate_key_method: SHA2             # resolved per layer: gold -> SHA2, silver -> NONE
  # see templates/conventions.yml for formula documentation
  surrogate_key_formula:
    bigint: "CAST(CONV(SUBSTRING(SHA2(CONCAT_WS('|', COALESCE(CAST({natural_key} AS STRING), '~')), 256), 1, 15), 16, 10) AS BIGINT)"
    string: "SHA2(COALESCE(CAST({natural_key} AS STRING), '~'), 256)"
  fk_naming: same_as_parent_pk

# type_1 — keeps both layers on current-state (MVs / ST-APPEND). type_2 would be a GOLD-only concept
# (AUTO CDC SCD2 + CDF on bronze) and is out of scope for the base hybrid recipe; confirm before enabling.
scd_strategy: type_1
