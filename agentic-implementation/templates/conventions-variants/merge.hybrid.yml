# =============================================================================
# OVERLAY: etl_type: merge_notebook  ×  output_model: hybrid
# =============================================================================
# TWO layers via the MERGE trio, built in sequence:
#   - SILVER (3NF SSOT, reads bronze): product-named tables, natural PKs, NO dim_/fact_, NO
#     surrogates. Built by Type-1 MERGE on the model PK. (hybrid-silver == normalized.)
#   - GOLD (dimensional Kimball star, reads SILVER not bronze): dim_/fact_ + SHA2 *_Key surrogates,
#     -1 Unknown members seeded; each fact FK resolved by LEFT JOIN to the built gold dim +
#     COALESCE(...Key, -1) (never inline-recompute the surrogate). Emitted as DDL + MERGE/INSERT
#     OVERWRITE into the gold schema. See gold-and-metrics.md "hybrid" row.
# Silver first; gold reads silver. 🔴 A gold object that re-reads bronze is a bug.
#
# Set the blocks below on top of a filled-in templates/conventions.yml. See that base file for
# every other knob + full rationale.
# =============================================================================

etl_type: merge_notebook       # DDL + Type-1 MERGE trio + daily job; gold star also via MERGE
output_model: hybrid           # LAYERED: normalized silver THEN dimensional gold (not both-at-once)

# TWO layers -> TWO schemas.
schemas:
  silver_pattern: "{domain}_silver"      # 3NF SSOT (normalized)
  gold_pattern:   "{domain}_gold"        # dimensional star (built downstream from silver)
  sandbox_pattern: "{domain}_{layer}_{project}"

# 🔴 LAYER-RESOLVED — do NOT read these keys as global literals. This block is the DIMENSIONAL/
# hybrid-GOLD default; the SILVER layer follows `normalized` regardless (product names, natural
# PKs, no dim_/fact_, no surrogates). See naming-standards.md "⚠️ Precedence & key strategy by mode".
naming:
  table_case: lower_snake                # gold: dim_customer, fact_service_order
  dim_prefix: "dim_"                      # hybrid GOLD only (silver follows the model: no prefix)
  fact_prefix: "fact_"                   # hybrid GOLD only
  bridge_prefix: "bridge_"               # hybrid GOLD only
  gold_prefix: ""
  entity_form: singular
  business_column_case: Pascal_Snake     # gold: Pascal_Snake; silver follows the model
  metadata_column_case: _lower_snake     # ALWAYS, all modes
  surrogate_key_suffix: "_Key"           # gold: {Entity}_Key (silver keeps natural PKs)
  surrogate_key_method: SHA2             # resolved per layer: gold -> SHA2, silver -> NONE
  # see templates/conventions.yml for formula documentation
  surrogate_key_formula:
    bigint: "CAST(CONV(SUBSTRING(SHA2(CONCAT_WS('|', COALESCE(CAST({natural_key} AS STRING), '~')), 256), 1, 15), 16, 10) AS BIGINT)"
    string: "SHA2(COALESCE(CAST({natural_key} AS STRING), '~'), 256)"
  fk_naming: same_as_parent_pk

# type_1 keeps gold dims as current-state. type_2 is valid here but applies to the GOLD star ONLY
# (dimensional layer); the normalized silver layer never versions.
scd_strategy: type_1
