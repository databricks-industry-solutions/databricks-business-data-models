# conventions.yml — Meridian field_service (dimensional, merge_notebook)
customer: meridian
domain: field_service

output_model: dimensional     # normalized | dimensional | hybrid
etl_type: merge_notebook      # merge_notebook | sdp_pipeline

# Vibe model (READ-ONLY — the deployed model the assessment reads)
vibe_model:
  catalog: meridian_model
  schema:  field_service_model

# Catalog map (LAND/WRITE targets — never the vibe_model catalog)
catalogs:
  bronze: meridian_bronze
  silver: meridian_silver
  gold:   meridian_silver
  sandbox: meridian_silver

# Schema patterns (distinct from other flows so builds coexist)
schemas:
  silver_pattern: "{domain}_silver_dim"
  gold_pattern:   "{domain}_gold"
  sandbox_pattern: "{domain}_{layer}_{project}"

etl_language: sql             # sql | python

# Bronze source map (logical name → catalog.schema)
bronze_sources:
  src_fieldlink: meridian_bronze.fieldlink
  src_sap_sd:    meridian_bronze.sap_sd

# Object naming
naming:
  table_case: lower_snake
  dim_prefix: "dim_"
  fact_prefix: "fact_"
  bridge_prefix: "bridge_"
  gold_prefix: ""
  entity_form: singular
  business_column_case: Pascal_Snake
  metadata_column_case: _lower_snake
  surrogate_key_suffix: "_Key"
  surrogate_key_method: SHA2
  # see templates/conventions.yml for formula documentation
  surrogate_key_formula:
    bigint: "CAST(CONV(SUBSTRING(SHA2(CONCAT_WS('|', COALESCE(CAST({natural_key} AS STRING), '~')), 256), 1, 15), 16, 10) AS BIGINT)"
    string: "SHA2(COALESCE(CAST({natural_key} AS STRING), '~'), 256)"
  fk_naming: same_as_parent_pk

# Audit / metadata columns (added to every table)
audit_columns:
  prefix: "_"
  columns: [_source_system, _loaded_at, _created_by, _modified_by]
  event_timestamp: _source_updated_at

# Source-system enum (values written into _source_system)
source_systems:
  - FIELDLINK
  - SAP_S4

# Source-system LABEL per bronze source (logical -> _source_system value; must be in source_systems)
source_system_labels:
  src_fieldlink: FIELDLINK
  src_sap_sd:    SAP_S4

# Physical date/timestamp formats per source (pre-populates Rule C; the probe still runs as the gate)
date_formats:
  src_fieldlink: 'yyyy-MM-dd'
  src_sap_sd:    'yyyyMMdd'      # SAP stores dates as 8-digit strings

# Load-strategy thresholds
load_strategy:
  full_merge_max_rows: 5_000_000
  incremental_max_rows: 100_000_000

# Gap-status enum
gap_status_enum: [OPEN, IN_PROGRESS, DEFERRED, ACCEPTED, RESOLVED]

# SCD strategy
scd_strategy: type_1          # type_1 | type_2

# Deployment (resolved via DAB variables, not baked into SQL)
deployment:
  workspace_host: ""
  alert_email: ""
  default_schedule_cron: "0 0 6 * * ? *"
  default_timezone: UTC
