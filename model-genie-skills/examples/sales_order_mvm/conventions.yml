# ─────────────────────────────────────────────────────────────────────
# conventions.yml — Meridian Manufacturing · Sales Order domain
# Generated by domain-model-assessment Phase −1 (Config Bootstrap)
# ─────────────────────────────────────────────────────────────────────

# ── Identity ──────────────────────────────────────────────────────────
customer: meridian
domain:   sales_order

# ── Output Shape ──────────────────────────────────────────────────────
# hybrid = normalized 3NF silver first, then a dimensional gold star
# built downstream from it (layered, not both-shapes-at-once).
output_model: hybrid

# ── ETL Type ──────────────────────────────────────────────────────────
# sdp_pipeline = one declarative Lakeflow pipeline for the whole domain;
# less code, managed refresh.
etl_type: sdp_pipeline

# ── Language ──────────────────────────────────────────────────────────
etl_language: sql

# ── Vibe Model (READ-ONLY source — the skill never writes here) ──────
vibe_model:
  catalog:          manufacturing_mvm_v1
  schema:           sales_order
  metamodel_schema: _metamodel
  metamodel_prefix: ""            # un-prefixed (bare table names in _metamodel)
  # version: 2                    # resolved from MAX(version) for this domain

# ── Target Catalogs ───────────────────────────────────────────────────
catalogs:
  bronze: manufacturing_bronze_vibe    # READ-ONLY for this skill
  silver: manufacturing_silver_vibe    # silver WRITE target
  gold:   manufacturing_gold_vibe    # gold layer

# ── Bronze Sources (logical name → catalog.schema) ────────────────────
bronze_sources:
  src_sap_sd:         manufacturing_bronze_vibe.sap_sd_mvm
  src_salesforce_crm: manufacturing_bronze_vibe.salesforce_crm_mvm
  src_returns_portal: manufacturing_bronze_vibe.returns_portal_mvm

# ── SCD Strategy ──────────────────────────────────────────────────────
scd_strategy: type_1

# ── Load Strategy Thresholds ──────────────────────────────────────────
load_strategy:
  full_merge_max_rows:    5_000_000
  incremental_max_rows: 100_000_000

# ── Null Column Handling ──────────────────────────────────────────────
null_columns:
  disposition: drop      # keep | drop — global default for 100%-null columns

# ── Model Deviation (all OFF — safe default) ──────────────────────────
# Deviation makes descoping explicit and recoverable.
# Can be enabled at the Completion Self-Audit gate.
model_deviation:
  preset:                   custom
  drop_null_columns:        true      # all 20 NULL_SOURCE columns dropped
  drop_unbuilt_domain_fks:  false
  drop_no_process_tables:   true     # pricing conditions not part of business processes
  allow_new_entities:       true     # delivery, delivery_line, credit_check added from discovery

# ── Model Edits (Phase 2C dispositions — edit in place) ───────────────
# These override the frozen metamodel for the build. Recorded decisions:
model_edits:

  # --- DROPPED entities (business coherence — not part of our processes) ---
  dropped_entities:
    - entity: order_header_condition
      reason: "Pricing conditions are not part of our business processes"
      disposition: DROPPED
      coherence_basis: "User-confirmed: header-level pricing condition records not needed"

    - entity: order_line_condition
      reason: "Pricing conditions are not part of our business processes"
      disposition: DROPPED
      coherence_basis: "User-confirmed: line-level pricing condition records not needed"

  # --- NET-NEW entities (discovered from bronze, added via assessment) ---
  new_entities:
    - entity: delivery
      table_name: delivery
      type: Transactional
      subdomain: contract_delivery
      primary_key: delivery_id
      source: sap_sd_mvm.likp
      source_rows: 3244
      natural_key: vbeln_delivery
      description: >-
        Outbound delivery document tracking physical shipment of goods against
        a sales order. Captures delivery number, shipping point, planned and
        actual goods issue dates, transportation type, and route.
      attributes:
        - { target: delivery_id,            type: BIGINT,         source: DERIVED,          note: "Surrogate PK" }
        - { target: delivery_number,        type: STRING,         source: vbeln_delivery,   note: "Natural key" }
        - { target: order_id,               type: BIGINT,         source: DERIVED,          note: "FK → order via vbeln_order" }
        - { target: order_number,           type: STRING,         source: vbeln_order,      note: "Natural FK to order" }
        - { target: planned_delivery_date,  type: DATE,           source: lfdat,            note: "TRY_TO_DATE(col,'yyyyMMdd')" }
        - { target: actual_goods_issue_date,type: DATE,           source: wadat_ist,        note: "TRY_TO_DATE(col,'yyyyMMdd')" }
        - { target: shipping_point_code,    type: STRING,         source: vstel,            note: "Direct map" }
        - { target: transportation_type_code,type: STRING,        source: traty,            note: "Direct map" }
        - { target: route_code,             type: STRING,         source: route,            note: "Direct map" }
        - { target: source_system,          type: STRING,         source: source_system,    note: "Direct map" }
        - { target: created_timestamp,      type: TIMESTAMP,      source: DERIVED,          note: "ETL audit" }
        - { target: last_modified_timestamp,type: TIMESTAMP,      source: DERIVED,          note: "ETL audit" }

    - entity: delivery_line
      table_name: delivery_line
      type: Transactional
      subdomain: contract_delivery
      primary_key: delivery_line_id
      source: sap_sd_mvm.lips
      source_rows: 9605
      natural_key: vbeln_delivery, posnr
      description: >-
        Individual line item within an outbound delivery capturing product-level
        shipment detail. Captures delivered quantity, material/SKU reference,
        batch/lot, serial number, and links to originating order line.
      attributes:
        - { target: delivery_line_id,       type: BIGINT,         source: DERIVED,          note: "Surrogate PK" }
        - { target: delivery_id,            type: BIGINT,         source: DERIVED,          note: "FK → delivery" }
        - { target: delivery_number,        type: STRING,         source: vbeln_delivery,   note: "Natural FK to delivery" }
        - { target: line_number,            type: STRING,         source: posnr,            note: "Delivery item number" }
        - { target: order_number,           type: STRING,         source: vbeln_order,      note: "Natural FK to order" }
        - { target: order_line_number,      type: STRING,         source: posnr_order,      note: "Natural FK to order_line" }
        - { target: order_line_id,          type: BIGINT,         source: DERIVED,          note: "FK → order_line" }
        - { target: delivered_quantity,      type: DECIMAL(18,4),  source: lfimg,            note: "CAST to decimal" }
        - { target: sku_code,               type: STRING,         source: matnr,            note: "Material number" }
        - { target: sku_id,                 type: BIGINT,         source: DERIVED,          note: "FK → product_catalog.sku" }
        - { target: batch_number,           type: STRING,         source: charg,            note: "Batch/lot" }
        - { target: serial_number,          type: STRING,         source: serial,           note: "Serial number" }
        - { target: source_system,          type: STRING,         source: source_system,    note: "Direct map" }
        - { target: created_timestamp,      type: TIMESTAMP,      source: DERIVED,          note: "ETL audit" }
        - { target: last_modified_timestamp,type: TIMESTAMP,      source: DERIVED,          note: "ETL audit" }

    - entity: credit_check
      table_name: credit_check
      type: Transactional
      subdomain: order_processing
      primary_key: credit_check_id
      source: sap_sd_mvm.zcredit_log
      source_rows: 3104
      natural_key: vbeln, check_ts
      description: >-
        Credit management check event capturing the outcome of each credit
        evaluation during sales order processing. Captures credit limit,
        exposure before/after, order value, check result, credit control area.
      attributes:
        - { target: credit_check_id,        type: BIGINT,         source: DERIVED,          note: "Surrogate PK" }
        - { target: order_id,               type: BIGINT,         source: DERIVED,          note: "FK → order via vbeln" }
        - { target: order_number,           type: STRING,         source: vbeln,            note: "Natural FK to order" }
        - { target: account_id,             type: BIGINT,         source: DERIVED,          note: "FK → customer.account via kunnr" }
        - { target: customer_account_number,type: STRING,         source: kunnr,            note: "Natural FK to customer" }
        - { target: check_timestamp,        type: TIMESTAMP,      source: check_ts,         note: "TRY_TO_DATE(col,'yyyyMMdd')" }
        - { target: check_type,             type: STRING,         source: check_type,       note: "Direct map" }
        - { target: credit_limit,           type: DECIMAL(18,2),  source: klimk,            note: "CAST to decimal" }
        - { target: exposure_before,        type: DECIMAL(18,2),  source: exp_before,       note: "CAST to decimal" }
        - { target: order_value,            type: DECIMAL(18,2),  source: order_val,        note: "CAST to decimal" }
        - { target: exposure_after,         type: DECIMAL(18,2),  source: exp_after,        note: "CAST to decimal" }
        - { target: check_result,           type: STRING,         source: result,           note: "Direct map" }
        - { target: credit_control_area,    type: STRING,         source: kkber,            note: "Direct map" }
        - { target: credit_control_point,   type: STRING,         source: ctlpc,            note: "Direct map" }
        - { target: source_system,          type: STRING,         source: DERIVED,          note: "ETL source tag" }
        - { target: created_timestamp,      type: TIMESTAMP,      source: DERIVED,          note: "ETL audit" }
        - { target: last_modified_timestamp,type: TIMESTAMP,      source: DERIVED,          note: "ETL audit" }
