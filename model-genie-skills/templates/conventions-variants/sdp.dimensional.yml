# =============================================================================
# OVERLAY: etl_type: sdp_pipeline  ×  output_model: dimensional   (single layer)
# =============================================================================
# Kimball star built as ONE whole-domain Lakeflow Declarative Pipeline. Dims -> MATERIALIZED VIEW
# (small/recomputable); fact -> STREAMING TABLE + append flow (ST-APPEND). dim_/fact_ + SHA2 *_Key
# surrogates, -1 Unknown members. SINGLE LAYER — the star IS the silver output and reads BRONZE
# directly (no normalized SSOT underneath; that would be hybrid).
#
# 🔴 FK resolution: fact resolves each FK to the dim's SHA2 surrogate via LEFT JOIN to the dim MV +
# COALESCE(dim.Key, -1) — NOT an inline hash recompute, and NOT a LIVE.* subquery in a CONSTRAINT
# EXPECT (unsupported). Guard the fact grain on the natural/degenerate key, NEVER the SHA2 surrogate
# (it can never be NULL, so a constraint on it never fires). See sdp-pipeline-development.md
# "FK validation by output_model — and the LIVE.* trap".
#
# SDP-mode invariants (all cells): DDL inside the flow; HARDCODED bronze paths (no `parameters:`,
# no IDENTIFIER(:param)); NO build-time test/validation artifact; plain .sql FILE-model sources (no
# notebook-source header); deploy = ONE `pipeline` DAB resource. See sdp-pipeline-development.md.
#
# Set the blocks below on top of a filled-in templates/conventions.yml. NOTE: SDP mode has NO
# test_scratch_* keys — omit them, or delete any you added to the base.
# =============================================================================

etl_type: sdp_pipeline         # one whole-domain Lakeflow Declarative Pipeline
output_model: dimensional      # Kimball star; MVs (dims) + ST-APPEND (fact), reading bronze

# SINGLE-LAYER silver. root_path: ../src/silver/pipeline (NOT ../src); ONE glob
# ../src/silver/pipeline/** ; no gold glob.
schemas:
  silver_pattern: "{domain}_silver_sdp_dim"  # distinct suffix so it can coexist with other flows
  gold_pattern:   "{domain}_gold"        # unused in single-layer dimensional mode
  sandbox_pattern: "{domain}_{layer}_{project}"

# Kimball naming applies wholesale (single layer — same as merge.dimensional).
naming:
  table_case: lower_snake
  dim_prefix: "dim_"
  fact_prefix: "fact_"
  bridge_prefix: "bridge_"
  gold_prefix: ""
  entity_form: singular
  business_column_case: Pascal_Snake
  metadata_column_case: _lower_snake     # ALWAYS, all modes
  surrogate_key_suffix: "_Key"
  surrogate_key_method: SHA2
  # see templates/conventions.yml for formula documentation
  surrogate_key_formula:
    bigint: "CAST(CONV(SUBSTRING(SHA2(CONCAT_WS('|', COALESCE(CAST({natural_key} AS STRING), '~')), 256), 1, 15), 16, 10) AS BIGINT)"
    string: "SHA2(COALESCE(CAST({natural_key} AS STRING), '~'), 256)"
  fk_naming: same_as_parent_pk

# type_1 keeps dims as MATERIALIZED VIEWs. type_2 would route dims to the AUTO CDC SCD2 template
# (stored_as_scd_type=2) + require CDF on bronze — a separate, heavier path; confirm before enabling.
scd_strategy: type_1
