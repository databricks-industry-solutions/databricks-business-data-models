# =============================================================================
# OVERLAY: etl_type: merge_notebook  ×  output_model: normalized
# =============================================================================
# Faithful 3NF port of the vibe model (ONE table per product, natural PKs preserved, product
# names verbatim, NO dim_/fact_ prefixes, NO SHA2 surrogates) built by the MERGE trio (per-entity
# DDL + Type-1 MERGE on the model PK + a DQ validation notebook + a daily job). Single-layer SSOT.
#
# Set the blocks below on top of a filled-in templates/conventions.yml. See that base file for
# every other knob + full rationale.
# =============================================================================

etl_type: merge_notebook       # DDL + Type-1 MERGE trio + daily job (override — default is sdp_pipeline)
output_model: normalized       # 3NF SSOT; inherit the model's structure, apply NO Kimball rules (default shape)

schemas:
  silver_pattern: "{domain}_silver"      # 3NF products land in silver
  gold_pattern:   "{domain}_gold"        # optional — add metric views here (3NF isn't Genie-friendly raw)
  sandbox_pattern: "{domain}_{layer}_{project}"

# NORMALIZED: the vibe model's DDL is authoritative for EVERY table. Follow its product names,
# natural keys, and column casing. dim_/fact_/bridge_ prefixes + SHA2 surrogates are NOT applied;
# only metadata casing (_lower_snake) + the -1 FK default apply. See naming-standards.md
# "⚠️ Precedence & key strategy by mode".
naming:
  table_case: lower_snake                # product tables: customer, installed_asset, service_order
  dim_prefix: ""                          # NO dim_ prefix
  fact_prefix: ""                        # NO fact_ prefix
  bridge_prefix: ""                      # NO bridge_ prefix
  gold_prefix: ""
  entity_form: singular
  business_column_case: follow_model     # follow the vibe model's column names/casing
  metadata_column_case: _lower_snake     # ALWAYS, all modes
  surrogate_key_suffix: ""               # no surrogate keys — model's natural PKs
  surrogate_key_method: NONE             # follow the model's PKs (surrogate only by exception)
  # see templates/conventions.yml for formula documentation
  surrogate_key_formula:
    bigint: "CAST(CONV(SUBSTRING(SHA2(CONCAT_WS('|', COALESCE(CAST({natural_key} AS STRING), '~')), 256), 1, 15), 16, 10) AS BIGINT)"
    string: "SHA2(COALESCE(CAST({natural_key} AS STRING), '~'), 256)"
  fk_naming: same_as_parent_pk           # FK column == parent's PK name (the model's natural key)

# type_2 is INVALID in normalized mode (3NF does history via temporal/effective-dating; the skill
# errors on normalized + type_2 and redirects to hybrid). Keep type_1.
scd_strategy: type_1
