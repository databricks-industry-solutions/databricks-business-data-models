# =============================================================================
# OVERLAY: etl_type: merge_notebook  ×  output_model: dimensional
# =============================================================================
# Kimball star (dim_/fact_ + SHA2 *_Key surrogates) built by the MERGE trio (per-entity DDL +
# Type-1 MERGE load notebooks + a DQ validation notebook + a daily job). Single-layer: the star
# IS the silver output, reading bronze directly.
#
# NOTE: neither knob is the default any more (default = sdp_pipeline / normalized), so BOTH the
# etl_type and output_model lines below are explicit overrides. Set the blocks below on top of a
# filled-in templates/conventions.yml. See that base file for every other knob + full rationale.
# =============================================================================

etl_type: merge_notebook       # DDL + Type-1 MERGE trio + daily job
output_model: dimensional      # Kimball star; the model SEEDs the design, then dimensionalize

schemas:
  silver_pattern: "{domain}_silver"      # star lands in silver, e.g. {domain}_silver
  gold_pattern:   "{domain}_gold"        # optional consumer marts/metrics on top
  sandbox_pattern: "{domain}_{layer}_{project}"

# Kimball naming applies wholesale (single layer — no per-layer resolution here).
naming:
  table_case: lower_snake
  dim_prefix: "dim_"
  fact_prefix: "fact_"
  bridge_prefix: "bridge_"
  gold_prefix: ""
  entity_form: singular
  business_column_case: Pascal_Snake     # Asset_Id, Commissioning_Status
  metadata_column_case: _lower_snake     # ALWAYS, all modes
  surrogate_key_suffix: "_Key"           # {Entity}_Key
  surrogate_key_method: SHA2             # dimensional -> SHA2 (mandatory if type_2)
  # see templates/conventions.yml for formula documentation
  surrogate_key_formula:
    bigint: "CAST(CONV(SUBSTRING(SHA2(CONCAT_WS('|', COALESCE(CAST({natural_key} AS STRING), '~')), 256), 1, 15), 16, 10) AS BIGINT)"
    string: "SHA2(COALESCE(CAST({natural_key} AS STRING), '~'), 256)"
  fk_naming: same_as_parent_pk

scd_strategy: type_1           # type_1 | type_2  (type_2 valid here — forces SHA2 surrogates)
