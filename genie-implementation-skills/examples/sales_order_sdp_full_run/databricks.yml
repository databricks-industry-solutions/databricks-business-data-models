# Declarative Automation Bundle — Meridian Sales Order Silver (SDP Pipeline)
# Output model: hybrid (normalized 3NF silver → dimensional gold star downstream)
# Pipeline: single triggered pipeline with 17 silver entities (15 MV + 2 ST)
bundle:
  name: meridian_sales_order_silver_sdp

variables:
  silver_catalog:
    default: manufacturing_silver_vibe
  silver_schema:
    default: sales_order_silver_sdp
  gold_catalog:
    default: manufacturing_silver_vibe
  gold_schema:
    default: sales_order_gold_sdp
  alert_email:
    default: stuart.swartz@databricks.com

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    variables:
      silver_catalog: manufacturing_silver_vibe
      silver_schema: sales_order_silver_sdp
      gold_catalog: manufacturing_silver_vibe
      gold_schema: sales_order_gold_sdp

  prod:
    mode: production
    variables:
      silver_catalog: manufacturing_silver_vibe
      silver_schema: sales_order_silver_sdp
      gold_catalog: manufacturing_silver_vibe
      gold_schema: sales_order_gold_sdp
