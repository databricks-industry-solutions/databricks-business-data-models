# Meridian Sales Order — Gold Validation Job
# Runs gold-layer narrative validation notebooks in tier order,
# then the scorecard to claim results and enforce the quality gate.
#
# Schedule: Daily 07:30 UTC (after silver load at 06:00 + gold SDP refresh)
# Trigger: PAUSED until gold pipeline confirmed stable

resources:
  jobs:
    meridian_sales_order_gold_validation:
      name: "meridian_sales_order_gold_validation"
      schedule:
        quartz_cron_expression: "0 30 7 * * ?"
        timezone_id: "UTC"
        pause_status: "PAUSED"
      email_notifications:
        on_failure:
          - stuart.swartz@databricks.com
      tags:
        domain: sales_order
        layer: gold
        purpose: validation
      parameters:
        - name: silver_catalog
          default: manufacturing_silver_vibe
        - name: silver_schema
          default: sales_order_gold_sdp
      tasks:
        # ─── Phase 0: Schema Setup ─────────────────────────────────────
        - task_key: ddl_validation_schema
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/ddl_validation_schema
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        # ─── Tier G0: Root Dimensions (parallel) ───────────────────────
        - task_key: narrative_dim_date
          depends_on:
            - task_key: ddl_validation_schema
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_dim_date
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        - task_key: narrative_dim_sales_area
          depends_on:
            - task_key: ddl_validation_schema
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_dim_sales_area
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        - task_key: narrative_dim_channel
          depends_on:
            - task_key: ddl_validation_schema
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_dim_channel
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        - task_key: narrative_dim_order_reason
          depends_on:
            - task_key: ddl_validation_schema
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_dim_order_reason
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        # ─── Tier G1: Conformed Dimensions + Bridge (parallel) ─────────
        - task_key: narrative_dim_customer
          depends_on:
            - task_key: narrative_dim_date
            - task_key: narrative_dim_sales_area
            - task_key: narrative_dim_channel
            - task_key: narrative_dim_order_reason
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_dim_customer
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        - task_key: narrative_dim_material
          depends_on:
            - task_key: narrative_dim_date
            - task_key: narrative_dim_sales_area
            - task_key: narrative_dim_channel
            - task_key: narrative_dim_order_reason
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_dim_material
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        - task_key: narrative_dim_sales_contract
          depends_on:
            - task_key: narrative_dim_date
            - task_key: narrative_dim_sales_area
            - task_key: narrative_dim_channel
            - task_key: narrative_dim_order_reason
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_dim_sales_contract
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        - task_key: narrative_bridge_order_partner
          depends_on:
            - task_key: narrative_dim_date
            - task_key: narrative_dim_sales_area
            - task_key: narrative_dim_channel
            - task_key: narrative_dim_order_reason
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_bridge_order_partner
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        # ─── Tier G2: Facts (parallel, depend on all dims) ─────────────
        - task_key: narrative_fact_sales_order_line
          depends_on:
            - task_key: narrative_dim_customer
            - task_key: narrative_dim_material
            - task_key: narrative_dim_sales_contract
            - task_key: narrative_bridge_order_partner
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_fact_sales_order_line
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        - task_key: narrative_fact_otd
          depends_on:
            - task_key: narrative_dim_customer
            - task_key: narrative_dim_material
            - task_key: narrative_dim_sales_contract
            - task_key: narrative_bridge_order_partner
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_fact_otd
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        - task_key: narrative_fact_quotation_line
          depends_on:
            - task_key: narrative_dim_customer
            - task_key: narrative_dim_material
            - task_key: narrative_dim_sales_contract
            - task_key: narrative_bridge_order_partner
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_fact_quotation_line
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        - task_key: narrative_fact_return_line
          depends_on:
            - task_key: narrative_dim_customer
            - task_key: narrative_dim_material
            - task_key: narrative_dim_sales_contract
            - task_key: narrative_bridge_order_partner
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_fact_return_line
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        - task_key: narrative_fact_credit_check
          depends_on:
            - task_key: narrative_dim_customer
            - task_key: narrative_dim_material
            - task_key: narrative_dim_sales_contract
            - task_key: narrative_bridge_order_partner
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/narrative_fact_credit_check
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"

        # ─── Scorecard: Claims PENDING, grades, quality gate ───────────
        - task_key: scorecard
          depends_on:
            - task_key: narrative_fact_sales_order_line
            - task_key: narrative_fact_otd
            - task_key: narrative_fact_quotation_line
            - task_key: narrative_fact_return_line
            - task_key: narrative_fact_credit_check
          notebook_task:
            notebook_path: /Workspace/Users/stuart.swartz@databricks.com/vibe-modeling-skills-testing/vibe-model-skills-testing/meridian/sales-order/sdp/hybrid/src/gold/validation/scorecard
            base_parameters:
              silver_catalog: "{{job.parameters.silver_catalog}}"
              silver_schema: "{{job.parameters.silver_schema}}"
