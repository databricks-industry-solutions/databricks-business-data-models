# Lakeflow Spark Declarative Pipeline — Meridian Sales Order (Hybrid: Silver + Gold)
# Silver: 17 entities (15 MV + 2 ST) in sales_order_silver_sdp schema
# Gold: 13 entities (all MV) in sales_order_gold_sdp schema (hardcoded catalog.schema in each .sql)
# FILE model: plain .sql sources included via glob (no notebook-source header)
resources:
  pipelines:
    meridian_sales_order_silver_sdp:
      name: meridian_sales_order_silver_sdp
      channel: PREVIEW
      continuous: false
      catalog: ${var.silver_catalog}
      schema: ${var.silver_schema}
      root_path: ../src
      libraries:
        - glob:
            include: ../src/silver/pipeline/**
        # HYBRID: downstream gold star MVs — object names hardcoded to gold schema
        - glob:
            include: ../src/gold/pipeline/**
      notifications:
        - email_recipients:
            - ${var.alert_email}
          alerts:
            - on-update-failure
      serverless: true
      development: true
